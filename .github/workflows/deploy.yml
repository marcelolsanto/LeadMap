name: CI/CD LeadMap Homeserver

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          python -m pytest tests/unit -v

  deploy:
    name: Deploy to Homeserver Container
    needs: test
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Fix workspace permissions
        run: |
          sudo chown -R $USER:$USER . 2>/dev/null || true
          chmod -R u+rwX . 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Prepare Environment and Deploy
        run: |
          # Garante que o arquivo .env existe para o docker-compose
          if [ ! -f .env ]; then
            if [ -f /home/$USER/Documentos/PycharmProjects/LeadMap/.env ]; then
              cp /home/$USER/Documentos/PycharmProjects/LeadMap/.env .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          echo "Baixando imagem base do Playwright..."
          docker pull mcr.microsoft.com/playwright/python:v1.40.0-jammy || true

          # Remove pasta fantasma que o Docker criou no lugar do arquivo de log
          rm -rf erros_robo.log || true

          echo "Construindo e iniciando container com Docker Compose..."
          if docker compose version >/dev/null 2>&1; then
            docker compose down || true
            docker compose up -d --build --force-recreate
          elif docker-compose version >/dev/null 2>&1; then
            docker-compose down || true
            docker-compose up -d --build --force-recreate
          else
            echo "Docker Compose nao encontrado no PATH."
            exit 1
          fi

          echo "LeadMap Pro atualizado e rodando no Homeserver com sucesso!"
