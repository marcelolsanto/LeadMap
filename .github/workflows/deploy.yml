name: CI/CD LeadMap Homeserver

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          python -m pytest tests/unit -v

  deploy:
    name: Deploy to Homeserver Container
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Environment and Deploy
        run: |
          # Garante que o arquivo .env existe para o docker-compose
          if [ ! -f .env ]; then
            if [ -f /home/$USER/Documentos/PycharmProjects/LeadMap/.env ]; then
              cp /home/$USER/Documentos/PycharmProjects/LeadMap/.env .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Tenta docker compose v2, se nao usa docker-compose v1
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d --build
          elif docker-compose version >/dev/null 2>&1; then
            docker-compose up -d --build
          else
            echo "Docker nao encontrado no PATH do runner. Verifique permissões."
            exit 1
          fi

          echo "LeadMap Pro atualizado e rodando no Homeserver com sucesso!"
