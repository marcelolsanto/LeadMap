services:
  leadmap:
    build: .
    container_name: leadmap_pro
    ports:
      - "8501:8501"   # Streamlit UI
      - "8502:8502"   # Stripe Webhook Server
    volumes:
      # Persiste bancos SQLite e backups locais
      - ./data:/app/data
      # Persiste perfil de navegacao (cookies e sessoes do Maps)
      - ./perfil_chrome:/app/perfil_chrome
      # Persiste logs de execucao
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/erros_robo.log
    env_file:
      - .env
    restart: unless-stopped
